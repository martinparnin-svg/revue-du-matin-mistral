name: Fabriquer l'épisode (Mistral)

on:
  # Passages planifiés retirés le 21 novembre 2026 : le dépôt principal (revue-du-matin) lit
  # désormais lui-même ses épisodes avec Voxtral. Les réactiver ferait payer deux fois la même voix.
  # Ancien réglage (heures UTC, lundi à vendredi) : "40 5 * * 1-5", "40 6 * * 1-5", "15 7 * * 1-5".
  workflow_dispatch:
    inputs:
      date:
        description: "Date du script à lire (AAAA-MM-JJ), vide = aujourd'hui"
        required: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests pyyaml

      - name: Récupérer le script du jour
        run: python scripts/sync_episode.py "${{ github.event.inputs.date }}"

      - name: Synthèse vocale et assemblage
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/build_episode.py ${{ github.event.inputs.date }}

      - name: Publier l'épisode et le flux
        run: |
          git config user.name "revue-du-matin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs episodes
          git diff --cached --quiet && exit 0
          git commit -m "Épisode Mistral $(date -u +%F)"
          git pull --rebase
          git push
